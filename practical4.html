<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical 4 - DOM and Events</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 30px;
            text-align: center;
            transition: 0.3s;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #aaa;
        }

        input {
            padding: 10px;
            width: 60%;
            margin: 5px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #eee;
            margin: 8px;
            padding: 10px;
            border-radius: 5px;
        }

        .dark {
            background-color: #222;
            color: white;
        }

        .dark .container {
            background-color: #333;
        }

        .dark li {
            background-color: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>JavaScript DOM Interaction</h1>

    <h2 id="welcome">Welcome!</h2>

    <input type="text" id="nameInput" placeholder="Enter your name">
    <button id="saveName">Save Name</button>

    <hr>

    <h3>Add Items</h3>

    <input type="text" id="itemInput" placeholder="Enter an item">
    <button id="addItem">Add Item</button>

    <ul id="itemList"></ul>

    <button id="themeButton">Change Theme</button>

</div>

<script>

    // DOM Elements
    const nameInput = document.getElementById("nameInput");
    const saveName = document.getElementById("saveName");
    const welcome = document.getElementById("welcome");

    const itemInput = document.getElementById("itemInput");
    const addItem = document.getElementById("addItem");
    const itemList = document.getElementById("itemList");

    const themeButton = document.getElementById("themeButton");

    // Load saved name from localStorage
    window.addEventListener("load", function () {

        const savedName = localStorage.getItem("username");

        if (savedName) {
            welcome.textContent = "Welcome, " + savedName + "!";
            nameInput.value = savedName;
        }

        loadItems();
    });


    // Save name
    saveName.addEventListener("click", function () {

        const name = nameInput.value.trim();

        if (name === "") {
            alert("Please enter your name.");
            return;
        }

        localStorage.setItem("username", name);

        welcome.textContent = "Welcome, " + name + "!";
        alert("Name saved successfully!");
    });


    // Add item
    addItem.addEventListener("click", function () {

        const item = itemInput.value.trim();

        if (item === "") {
            alert("Please enter an item.");
            return;
        }

        createItem(item);
        saveItems();

        itemInput.value = "";
    });


    // Create list item
    function createItem(itemText) {

        const li = document.createElement("li");

        li.textContent = itemText + " ";

        const deleteButton = document.createElement("button");

        deleteButton.textContent = "Delete";

        deleteButton.addEventListener("click", function () {
            li.remove();
            saveItems();
        });

        li.appendChild(deleteButton);

        itemList.appendChild(li);
    }


    // Save list items
    function saveItems() {

        const items = [];

        document.querySelectorAll("#itemList li").forEach(function (li) {

            const text = li.firstChild.textContent.trim();

            items.push(text);
        });

        localStorage.setItem("items", JSON.stringify(items));
    }


    // Load list items
    function loadItems() {

        const savedItems = JSON.parse(localStorage.getItem("items")) || [];

        savedItems.forEach(function (item) {
            createItem(item);
        });
    }


    // Change theme
    themeButton.addEventListener("click", function () {

        document.body.classList.toggle("dark");

    });

</script>

</body>
</html>
